<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futuristic To‑Do App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app">
        <header class="app__header">
            <h1>🗒️ To‑Do Dashboard</h1>
            <input id="new-task" type="text" placeholder="What needs to be done?" autocomplete="off" />
        </header>
        <section class="app__filters">
            <button data-filter="all" class="filter active">All</button>
            <button data-filter="active" class="filter">Active</button>
            <button data-filter="completed" class="filter">Completed</button>
        </section>
        <ul id="task-list" class="task-list"></ul>
        <footer class="app__footer">
            <span id="total-count">0</span> tasks • 
            <span id="active-count">0</span> active • 
            <span id="completed-count">0</span> completed
        </footer>
    </main>
    <script src="script.js"></script>
</body>
</html>
